[['xray','xray'],['cut','cut'],['explode','explode'],['layout','layout']].forEach(([id,m])=>document.getElementById(id).onclick=()=>{if(mode===m){location.reload();return}setMode(m)});
document.querySelector('#home').onclick=()=>{if(inRoom)exitRoom();if(mode!=='normal')location.reload();camera.position.set(112,90,145);controls.target.set(0,15,0)};
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('dblclick',e=>{if(inRoom)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(clickable.map(c=>c.obj),true);if(hits.length){let target=hits[0].object;let item=clickable.find(c=>c.obj===target||c.obj===target.parent);if(item){if(item.label==='Istana Evermere')enterRoom('Throne Hall');else notify('Area: '+item.label+' — jelajahi dari dekat')}}});
let clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();for(const p of people){p.position.x+=Math.sin(t*.7+p.userData.phase)*.006;p.position.z+=Math.cos(t*.6+p.userData.phase)*.006;for(let i=0;i<p.children.length;i++){if(p.children[i].userData.partName==='villager arm')p.children[i].rotation.x=Math.sin(t*3+p.userData.phase)*.12}}
carts.forEach((c,i)=>{c.g.position.x+=.035;if(c.g.position.x>135)c.g.position.x=-135;c.horse.rotation.y=Math.sin(t*5+i)*.035});
controls.update();renderer.render(scene,camera)}
document.querySelector('#count').textContent='Bagian '+parts.length;document.querySelector('#people').textContent=people.length+' penduduk';document.querySelector('#carriages').textContent=carts.length+' kereta';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
animate();
</script>
</body>
</html>
